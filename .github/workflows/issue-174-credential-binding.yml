name: Issue 174 Credential Binding

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/config/credential.rs
      - src/config/settings.rs
      - src/providers/factory.rs
      - src/providers/model_catalog.rs
      - src/cli/setup_wizard.rs
      - src/cli/repl.rs
      - .github/workflows/issue-174-credential-binding.yml

jobs:
  credential-binding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --no-run
      - run: cargo test --lib config::credential::tests -- --nocapture
      - run: cargo test --lib providers::factory::tests -- --nocapture
      - run: cargo test --lib providers::model_catalog::tests -- --nocapture
      - run: cargo test --lib cli::setup_wizard::tests::named_ -- --nocapture
