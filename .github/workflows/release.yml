name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  # Speed up CI builds (override Cargo.toml's lto=true / codegen-units=1)
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  build-release:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: finch-macos-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: finch-linux-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Configure isolated Cargo download home
        run: scripts/configure_ci_cargo_home.sh

      - name: Resolve exact Cargo dependency graph
        run: cargo generate-lockfile

      - name: Restore exact Cargo downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/finch-cargo-home/registry/cache
            ${{ runner.temp }}/finch-cargo-home/git/db
          key: cargo-downloads-v1-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('**/Cargo.lock') }}

      - name: Install optional quota-LRU sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
        with:
          version: v0.17.0

      - name: Configure read-only compiler cache
        env:
          FINCH_SCCACHE_WRITER: "false"
        run: scripts/configure_ci_sccache.sh

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y capnproto pkg-config libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install capnp

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (non-Windows)
        run: strip target/${{ matrix.target }}/release/finch || true

      - name: Create tarball
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz finch

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          version="${tag#v}"

          cat > release_notes.md << 'NOTES'
          ## Finch VPLACEHOLDER

          Local-first AI coding assistant. Works great in cloud-only mode
          with Grok, Claude, GPT-4, or any other OpenAI-compatible API.

          ## Install

          **macOS (Apple Silicon — M1/M2/M3/M4):**
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/TAGPLACEHOLDER/finch-macos-arm64.tar.gz | tar xz
          sudo mv finch /usr/local/bin/
          ```

          **Linux (x86_64):**
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/TAGPLACEHOLDER/finch-linux-x86_64.tar.gz | tar xz
          sudo mv finch /usr/local/bin/
          ```

          ## First run

          ```bash
          finch setup          # interactive setup wizard (add your API key)
          finch --cloud-only   # start chatting, no model download needed
          ```

          ## Grok via X Premium+

          Get your API key at [console.x.ai](https://console.x.ai),
          then run `finch setup` and select Grok.
          NOTES

          # Substitute version and tag placeholders
          sed -i "s/VPLACEHOLDER/v${version}/g; s/TAGPLACEHOLDER/${tag}/g" release_notes.md

          gh release create "${tag}" \
            --title "Finch v${version}" \
            --notes-file release_notes.md \
            artifacts/finch-macos-arm64/finch-macos-arm64.tar.gz \
            artifacts/finch-linux-x86_64/finch-linux-x86_64.tar.gz
