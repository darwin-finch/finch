name: Brain isolation security

# Supervised isolation runs on Ubuntu and macOS only when isolation-owned paths
# change, weekly, or on demand. The three docs are scanned directly by
# scripts/test_brain_isolation.sh. The full-tree escape-API allowlist also runs
# on every PR through scripts/check_ci_workflow_manifest.py.
on:
  pull_request:
    paths:
      - '.github/workflows/issue-56-brain-isolation.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'schema/**'
      - 'src/bin/finch-test-supervisor.rs'
      - 'src/brain/**'
      - 'src/daemon/**'
      - 'src/ipc/**'
      - 'src/node/**'
      - 'src/server/**'
      - 'src/client/daemon_client.rs'
      - 'src/cli/repl_event/brain_handler.rs'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/AUTOMATIC_TRAINING.md'
      - 'docs/DEVELOPMENT.md'
      - 'tests/README.md'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/issue-56-brain-isolation.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'schema/**'
      - 'src/bin/finch-test-supervisor.rs'
      - 'src/brain/**'
      - 'src/daemon/**'
      - 'src/ipc/**'
      - 'src/node/**'
      - 'src/server/**'
      - 'src/client/daemon_client.rs'
      - 'src/cli/repl_event/brain_handler.rs'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/AUTOMATIC_TRAINING.md'
      - 'docs/DEVELOPMENT.md'
      - 'tests/README.md'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-isolation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Each job's effective Cargo/Rust environment is part of its cache identity, so
# the job-level additions below must match the cache family each job restores.
env:
  CARGO_BUILD_JOBS: 1
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  isolation-boundaries:
    name: Isolation boundaries (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto (Ubuntu)
      run: sudo apt-get update && sudo apt-get install -y capnproto ripgrep

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Restore compatible isolation Cargo state
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      continue-on-error: true
      with:
        cache-provider: github
        shared-key: finch-cargo-v5-ubuntu-24.04-${{ runner.arch }}-x86_64-unknown-linux-gnu-rust-1.98.0-debug-default-test-debug-0_supervisor-release-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}
        cache-targets: true
        cache-bin: false
        cache-workspace-crates: false
        cache-all-crates: false
        cache-on-failure: false
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    - name: Check bins and tests
      timeout-minutes: 25
      run: cargo check --lib --bins --tests

    - name: Reject external provider binaries
      timeout-minutes: 15
      run: cargo test --test no_external_provider_binary_test -- --nocapture

    - name: Build isolation supervisor
      timeout-minutes: 40
      run: |
        cargo test --bin finch-test-supervisor signed_device_bits_serialize_as_parseable_u64_identity -- --exact
        cargo build --bin finch-test-supervisor
        cargo build --release --bin finch-test-supervisor
        install -m 0555 target/debug/finch-test-supervisor target/debug/finch-test-supervisor-pinned
        install -m 0555 target/release/finch-test-supervisor target/release/finch-test-supervisor-pinned

    # The whole module, not a list of names. Naming tests individually meant a test added to this
    # module was scheduled nowhere: it ran only in the quick matrix, which supplies no contract, so
    # its body returned at the guard and it reported pass without asserting anything (#614).
    - name: Brain isolation boundaries under the supervisor contract
      timeout-minutes: 25
      run: >-
        ./scripts/test_brains.sh cargo test --lib
        brain::isolation_tests::
        -- --nocapture

    - name: Reject rewritten proof at the production constructor
      timeout-minutes: 15
      run: >-
        ./scripts/test_brains.sh cargo test --lib
        server::tests::production_constructor_rejects_rewritten_proof_and_accepts_exact_restore
        -- --nocapture

    - name: Reject fixture traversal before external mutation
      timeout-minutes: 15
      run: |
        ./scripts/test_brains.sh cargo test --lib supervised_http_fixture_rejects -- --nocapture
        ./scripts/test_brains.sh cargo test --lib server::tests::supervised_http_fixture_pins_state_root_across_ancestor_swap -- --exact --nocapture
        ./scripts/test_brains.sh cargo test --lib ipc::server::tests::supervised_ipc_listener_ancestor_swap_never_mutates_replacement_path -- --exact --nocapture

    - name: Exercise real Brain and server paths behind the guard
      timeout-minutes: 25
      run: |
        ./scripts/test_brains.sh cargo test --lib brain::store -- --nocapture
        ./scripts/test_brains.sh cargo test --lib server::brain_service -- --nocapture
        ./scripts/test_brains.sh cargo test --lib server::tests::production_constructor_persists_named_brain_only_in_isolated_home -- --exact --nocapture
        ./scripts/test_brains.sh cargo test --lib server::tests::production_constructor_rejects_unverified_environment_before_store_mutation -- --exact --nocapture
        ./scripts/test_brains.sh cargo test --test daemon_integration_test test_daemon_spawn_and_health -- --exact --ignored --nocapture

    - name: Keep worker node identity inside disposable state
      timeout-minutes: 15
      run: |
        tests/worker_node_isolation_contract.sh
        ./scripts/test_brains.sh cargo test --test worker_integration_test -- --nocapture

    - name: Exercise the complete synthetic isolation harness
      timeout-minutes: 15
      run: ./scripts/test_brain_isolation.sh

  isolation-boundaries-macos:
    name: Isolation boundaries (macos-14)
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto (macOS)
      run: brew install capnp ripgrep

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Restore the macOS default Cargo family
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      continue-on-error: true
      with:
        cache-provider: github
        shared-key: finch-cargo-v5-macos-14-${{ runner.arch }}-aarch64-apple-darwin-rust-1.98.0-debug-default_supervisor-release_apple-release-default-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}
        cache-targets: true
        cache-bin: false
        cache-workspace-crates: false
        cache-all-crates: false
        cache-on-failure: false
        save-if: false

    - name: Check bins and tests
      timeout-minutes: 25
      run: cargo check --lib --bins --tests

    - name: Reject external provider binaries
      timeout-minutes: 15
      run: cargo test --test no_external_provider_binary_test -- --nocapture

    - name: Build isolation supervisor
      timeout-minutes: 40
      run: |
        cargo test --bin finch-test-supervisor signed_device_bits_serialize_as_parseable_u64_identity -- --exact
        cargo build --bin finch-test-supervisor
        cargo build --release --bin finch-test-supervisor
        install -m 0555 target/debug/finch-test-supervisor target/debug/finch-test-supervisor-pinned
        install -m 0555 target/release/finch-test-supervisor target/release/finch-test-supervisor-pinned

    # The whole module, not a list of names. Naming tests individually meant a test added to this
    # module was scheduled nowhere: it ran only in the quick matrix, which supplies no contract, so
    # its body returned at the guard and reported pass without asserting anything (#614).
    - name: Brain isolation boundaries under the supervisor contract
      timeout-minutes: 25
      run: >-
        ./scripts/test_brains.sh cargo test --lib
        brain::isolation_tests::
        -- --nocapture

    - name: Reject rewritten proof at the production constructor
      timeout-minutes: 15
      run: >-
        ./scripts/test_brains.sh cargo test --lib
        server::tests::production_constructor_rejects_rewritten_proof_and_accepts_exact_restore
        -- --nocapture

    - name: Reject fixture traversal before external mutation
      timeout-minutes: 15
      run: |
        ./scripts/test_brains.sh cargo test --lib supervised_http_fixture_rejects -- --nocapture
        ./scripts/test_brains.sh cargo test --lib server::tests::supervised_http_fixture_pins_state_root_across_ancestor_swap -- --exact --nocapture
        ./scripts/test_brains.sh cargo test --lib ipc::server::tests::supervised_ipc_listener_ancestor_swap_never_mutates_replacement_path -- --exact --nocapture

    - name: Exercise real Brain and server paths behind the guard
      timeout-minutes: 25
      run: |
        ./scripts/test_brains.sh cargo test --lib brain::store -- --nocapture
        ./scripts/test_brains.sh cargo test --lib server::brain_service -- --nocapture
        ./scripts/test_brains.sh cargo test --lib server::tests::production_constructor_persists_named_brain_only_in_isolated_home -- --exact --nocapture
        ./scripts/test_brains.sh cargo test --lib server::tests::production_constructor_rejects_unverified_environment_before_store_mutation -- --exact --nocapture
        ./scripts/test_brains.sh cargo test --test daemon_integration_test test_daemon_spawn_and_health -- --exact --ignored --nocapture

    - name: Keep worker node identity inside disposable state
      timeout-minutes: 15
      run: |
        tests/worker_node_isolation_contract.sh
        ./scripts/test_brains.sh cargo test --test worker_integration_test -- --nocapture

    - name: Exercise the complete synthetic isolation harness
      timeout-minutes: 15
      run: ./scripts/test_brain_isolation.sh
