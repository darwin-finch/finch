name: Issue 202 ChatGPT Subscription Transport v3

on:
  push:
    branches: [codex/issue-202-chatgpt-sol]
    paths:
      - "src/**"
      - "schema/**"
      - ".github/workflows/issue-202-chatgpt-transport-v3.yml"
  workflow_dispatch: {}

jobs:
  focused-transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install Cap'n Proto compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Install Cap'n Proto compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check changed Rust formatting
        run: >-
          rustfmt --edition 2021 --check
          src/brain/remote.rs src/brain/store.rs src/claude/client.rs
          src/claude/types.rs src/cli/conversation.rs src/cli/repl.rs
          src/cli/repl_event/event_loop.rs src/cli/repl_event/query_processor.rs
          src/cli/repl_event/query_state.rs src/generators/claude.rs
          src/generators/mod.rs src/ipc/brain_codec.rs src/ipc/client.rs
          src/ipc/mod.rs src/ipc/server.rs
          src/providers/chatgpt_subscription.rs src/providers/fallback_chain.rs
          src/providers/teacher_session.rs src/providers/types.rs
          src/server/brain_runner.rs src/server/brain_service.rs src/server/handlers.rs
      - name: Compile library and binary tests
        run: cargo test --no-run
      - name: Native subscription protocol regressions
        run: "cargo test --lib providers::chatgpt_subscription::"
      - name: Credential and factory boundary regressions
        run: |
          cargo test --lib providers::chatgpt_oauth::
          cargo test --lib providers::factory::
      - name: Platform and compatible-provider non-regressions
        run: |
          cargo test --lib providers::openai::
          cargo test --lib providers::gemini::
      - name: IPC and durable continuation regressions
        run: |
          cargo test --lib ipc::client::tests:: -- --nocapture
          cargo test --lib ipc::brain_codec::tests:: -- --nocapture
          cargo test --lib ipc::server::tests::runner_turn_result_decodes_ordered_capnp_lifecycle -- --exact
          cargo test --lib server::handlers::handler_tests::brain_history_remains_conversation_data_not_system_text -- --exact
          cargo test --lib server::handlers::handler_tests::brain_history_reconstructs_provider_tool_protocol -- --exact
          cargo test --lib cli::repl_event::query_processor::tests::completed_history_replaces_text_without_reordering_opaque_continuation -- --exact
          cargo test --lib cli::repl_event::query_state::tests:: -- --nocapture
          cargo test --lib cli::repl_event::event_loop::tests::named_brain_continuation_preserves_multi_text_and_opaque_order -- --exact
          cargo test --lib cli::conversation::tests::test_opaque_reasoning_continuation_survives_restart_byte_for_byte -- --exact
          cargo test --lib cli::conversation::tests::test_staged_tool_round_is_invisible_until_complete_atomic_commit -- --exact
      - name: No external provider binary regression
        run: cargo test --test no_external_provider_binary_test
