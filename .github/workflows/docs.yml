name: Documentation

on:
  pull_request:
    paths:
      - "**.md"
      - "scripts/check_docs.py"
      - ".agents/skills/finch-backlog/SKILL.md"
      - ".agents/skills/finch-backlog/references/review-protocol.md"
      - ".agents/skills/finch-backlog/references/solution-contract.md"
      - ".agents/skills/finch-backlog/references/issue-readiness.md"
      - ".agents/skills/finch-backlog/references/task-packet.md"
      - ".agents/skills/finch-backlog/references/work-claims.md"
      - ".agents/skills/finch-backlog/scripts/test-review-protocol"
      - ".github/workflows/docs.yml"
      - "scripts/ci_workflow_manifest.json"
  push:
    branches: [main]
    paths:
      - "**.md"
      - "scripts/check_docs.py"
      - ".agents/skills/finch-backlog/SKILL.md"
      - ".agents/skills/finch-backlog/references/review-protocol.md"
      - ".agents/skills/finch-backlog/references/solution-contract.md"
      - ".agents/skills/finch-backlog/references/issue-readiness.md"
      - ".agents/skills/finch-backlog/references/task-packet.md"
      - ".agents/skills/finch-backlog/references/work-claims.md"
      - ".agents/skills/finch-backlog/scripts/test-review-protocol"
      - ".github/workflows/docs.yml"
      - "scripts/ci_workflow_manifest.json"

permissions:
  contents: read

jobs:
  current-docs:
    name: Current docs links, claims, and shell syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_docs.py
      - run: .agents/skills/finch-backlog/scripts/test-review-protocol "$GITHUB_WORKSPACE"
