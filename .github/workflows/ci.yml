name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GitHub scopes pull_request caches to the merge ref, including fork PRs, so
# they may read main's cache but cannot replace it. Keep workflow privileges
# minimal because cached build outputs are restored before repository code runs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 1
  # Incremental state is large and tied to one invocation; cache reusable deps.
  CARGO_INCREMENTAL: 0

jobs:
  toolchain-contract:
    name: Toolchain and formatting contract
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: rustfmt

    - name: Verify canonical CI cache coverage
      run: python3 scripts/test_ci_cache_contract.py

    - name: Verify pinned toolchain and clean-checkout formatting
      run: tests/toolchain_contract.sh

  windows-format-contract:
    name: Toolchain and formatting contract (Windows)
    runs-on: windows-2025
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: rustfmt

    - name: Verify pinned Rust and rustfmt versions
      shell: pwsh
      run: |
        if (-not ((rustc --version) -like "rustc 1.98.0 *")) { exit 1 }
        if (-not ((rustfmt --version) -like "rustfmt 1.9.0-*")) { exit 1 }

    - name: Verify clean-checkout formatting
      run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.feature_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            feature_name: default
            cache_feature_set: default-and-all-features-clippy
            cargo_args: ""
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            feature_name: no-default-features
            cache_feature_set: no-default-features
            cargo_args: --no-default-features
          - os: macos-14
            target: aarch64-apple-darwin
            feature_name: default
            cache_feature_set: default
            cargo_args: ""
          - os: macos-14
            target: aarch64-apple-darwin
            feature_name: no-default-features
            cache_feature_set: no-default-features
            cargo_args: --no-default-features

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install capnproto (macOS)
      if: runner.os == 'macOS'
      run: brew install capnp

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: clippy

    # Cargo.lock is intentionally untracked in this repository. Materialize it
    # before hashFiles evaluates the exact dependency fingerprint below.
    - name: Resolve Cargo dependency graph
      run: cargo generate-lockfile

    - name: Cache Cargo dependency sources
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-deps-v1-${{ runner.os }}-rust-1.98.0-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-deps-v1-${{ runner.os }}-rust-1.98.0-

    - name: Cache compatible Cargo target artifacts
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          target/**/.fingerprint
          target/**/build
          target/**/deps
        key: cargo-target-v1-${{ runner.os }}-${{ matrix.target }}-rust-1.98.0-profile-dev-test-features-${{ matrix.cache_feature_set }}-cfg-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', '.github/workflows/ci.yml') }}-deps-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-target-v1-${{ runner.os }}-${{ matrix.target }}-rust-1.98.0-profile-dev-test-features-${{ matrix.cache_feature_set }}-cfg-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', '.github/workflows/ci.yml') }}-deps-

    - name: Run clippy (binary only, warnings allowed for now)
      if: runner.os == 'Linux' && matrix.feature_name == 'default'
      run: cargo clippy --bin finch --all-features
      continue-on-error: true

    - name: Build binary
      run: cargo build --bin finch ${{ matrix.cargo_args }} --verbose

    - name: Compile all targets
      run: cargo test --all-targets ${{ matrix.cargo_args }} --no-run

    - name: Test all targets
      run: cargo test --all-targets ${{ matrix.cargo_args }} -- --nocapture

    - name: Verify binary reports its version
      # Exercise Cargo's default binary selection so adding a test-only binary
      # cannot silently break the documented `cargo run -- <args>` workflow.
      run: cargo run ${{ matrix.cargo_args }} -- --version

  runtime-authority:
    name: Runtime Authority (Ubuntu)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Resolve Cargo dependency graph
      run: cargo generate-lockfile

    - name: Cache Cargo dependency sources
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-deps-v1-${{ runner.os }}-rust-1.98.0-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-deps-v1-${{ runner.os }}-rust-1.98.0-

    - name: Cache compatible Cargo target artifacts
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          target/**/.fingerprint
          target/**/build
          target/**/deps
        key: cargo-target-v1-${{ runner.os }}-x86_64-unknown-linux-gnu-rust-1.98.0-profile-test-features-default-cfg-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', '.github/workflows/ci.yml') }}-deps-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-target-v1-${{ runner.os }}-x86_64-unknown-linux-gnu-rust-1.98.0-profile-test-features-default-cfg-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', '.github/workflows/ci.yml') }}-deps-

    - name: Run runtime authority regressions
      run: cargo test --lib runtime::tests -- --nocapture

    - name: Compile all targets
      run: cargo test --all-targets --no-run

    - name: Regress scheduler and authority-use concurrency
      run: |
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::wait_rechecks_completion_after_registering_notification -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::agent_spawn_reenters_authority_to_snapshot_grants_without_deadlock -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::typed_agent_spec_attenuates_to_selected_opaque_grant -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::deferred_effect_sink_can_reenter_authority_without_deadlock -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::public_revocation_winning_before_host_use_prevents_file_mutation -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::in_flight_deferred_use_blocks_public_revoke_and_root_mutation -- --exact --nocapture

    - name: Test all targets
      run: timeout --signal=TERM --kill-after=30s 15m cargo test --all-targets -- --nocapture

  build:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # x86_64-apple-darwin is unsupported: ort has no prebuilt binary,
          # and GitHub no longer provides Intel macOS runners.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install capnproto (macOS)
      if: runner.os == 'macOS'
      run: brew install capnp

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        targets: ${{ matrix.target }}

    - name: Resolve Cargo dependency graph
      run: cargo generate-lockfile

    - name: Cache Cargo dependency sources
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-deps-v1-${{ runner.os }}-rust-1.98.0-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-deps-v1-${{ runner.os }}-rust-1.98.0-

    - name: Cache compatible Cargo target artifacts
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          target/**/.fingerprint
          target/**/build
          target/**/deps
        key: cargo-target-v1-${{ runner.os }}-${{ matrix.target }}-rust-1.98.0-profile-release-features-default-cfg-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', '.github/workflows/ci.yml') }}-deps-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-target-v1-${{ runner.os }}-${{ matrix.target }}-rust-1.98.0-profile-release-features-default-cfg-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', '.github/workflows/ci.yml') }}-deps-

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: finch-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/finch

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Resolve Cargo dependency graph
      run: cargo generate-lockfile

    - name: Cache Cargo dependency sources
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-deps-v1-${{ runner.os }}-rust-1.98.0-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-deps-v1-${{ runner.os }}-rust-1.98.0-

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Verify resolved HTTP dependency contract
      run: |
        python3 scripts/test_http_dependency_contract.py
        python3 scripts/check_http_dependency_contract.py

    - name: Run cargo audit
      run: cargo audit
