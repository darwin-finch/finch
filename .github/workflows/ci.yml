name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 1

jobs:
  toolchain-contract:
    name: Toolchain and formatting contract
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: rustfmt

    - name: Verify pinned toolchain and clean-checkout formatting
      run: tests/toolchain_contract.sh

  windows-format-contract:
    name: Toolchain and formatting contract (Windows)
    runs-on: windows-2025
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: rustfmt

    - name: Verify pinned Rust and rustfmt versions
      shell: pwsh
      run: |
        if (-not ((rustc --version) -like "rustc 1.98.0 *")) { exit 1 }
        if (-not ((rustfmt --version) -like "rustfmt 1.9.0-*")) { exit 1 }

    - name: Verify clean-checkout formatting
      run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.feature_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            feature_name: default
            cargo_args: ""
            timeout_minutes: 45
          - os: ubuntu-24.04
            feature_name: no-default-features
            cargo_args: --no-default-features
            timeout_minutes: 45
          - os: macos-14
            feature_name: default
            cargo_args: ""
            timeout_minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install capnproto (macOS)
      if: runner.os == 'macOS'
      run: brew install capnp ripgrep

    - name: Install Python for native repository checks
      if: runner.os == 'macOS'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: clippy

    - name: Cache Cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-rust-1.98.0-${{ matrix.feature_name }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-1.98.0-${{ matrix.feature_name }}-

    - name: Run clippy (binary only, warnings allowed for now)
      if: runner.os == 'Linux' && matrix.feature_name == 'default'
      run: cargo clippy --bin finch --all-features
      continue-on-error: true

    - name: Build binary
      run: cargo build --bin finch ${{ matrix.cargo_args }} --verbose

    - name: Compile all targets
      run: cargo test --all-targets ${{ matrix.cargo_args }} --no-run

    - name: Prove the removed finch::ssh API stays absent downstream
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      run: python3 scripts/check_removed_ssh_api.py ${{ matrix.cargo_args }}

    - name: Test all targets
      run: cargo test --all-targets ${{ matrix.cargo_args }} -- --nocapture

    - name: Prove validated request tokens cannot be forged
      if: runner.os == 'Linux' && matrix.feature_name == 'default'
      run: cargo test --doc -- ValidatedProviderRequest

    - name: Run release-mode atomic history regression
      if: runner.os == 'Linux' && matrix.feature_name == 'default'
      run: cargo test --release --lib cli::conversation::tests -- --nocapture

    - name: Verify shared skill discovery
      if: matrix.feature_name == 'default'
      shell: bash
      run: |
        test -L .claude/skills/finch-backlog
        test "$(cd .agents/skills/finch-backlog && pwd -P)" = "$(cd .claude/skills/finch-backlog && pwd -P)"

    - name: Check and exercise the Cargo slot
      if: matrix.feature_name == 'default'
      shell: bash
      run: |
        bash -n \
          .agents/skills/finch-backlog/scripts/with-cargo-slot \
          .agents/skills/finch-backlog/scripts/test-with-cargo-slot
        .agents/skills/finch-backlog/scripts/test-with-cargo-slot

    - name: Check the current tracked tree on macOS
      if: runner.os == 'macOS'
      run: python3 scripts/check_repository_hygiene.py

    - name: Run repository hygiene regressions on macOS
      if: runner.os == 'macOS'
      run: python3 scripts/test_repository_hygiene.py

    - name: Reject restoration of the removed SSH surface on macOS
      if: runner.os == 'macOS'
      run: python3 scripts/check_no_ssh_surface.py

    - name: Run removed SSH surface regressions on macOS
      if: runner.os == 'macOS'
      run: python3 scripts/test_no_ssh_surface.py

    - name: Build macOS isolation supervisor profiles
      if: runner.os == 'macOS'
      run: |
        cargo test --bin finch-test-supervisor signed_device_bits_serialize_as_parseable_u64_identity -- --exact
        cargo build --bin finch-test-supervisor
        cargo build --release --bin finch-test-supervisor
        install -m 0555 target/debug/finch-test-supervisor target/debug/finch-test-supervisor-pinned
        install -m 0555 target/release/finch-test-supervisor target/release/finch-test-supervisor-pinned

    - name: Reject self-issued proof authority on macOS
      if: runner.os == 'macOS'
      run: >-
        ./scripts/test_brains.sh cargo test --lib
        brain::isolation_tests::isolated_proof_rejects_self_issued_environment_authority
        -- --nocapture

    - name: Validate concurrent proof reads on macOS
      if: runner.os == 'macOS'
      run: >-
        ./scripts/test_brains.sh cargo test --lib
        brain::isolation_tests::isolated_proof_validation_is_offset_independent_under_concurrency
        -- --nocapture

    - name: Reject rewritten proof at the production constructor on macOS
      if: runner.os == 'macOS'
      run: >-
        ./scripts/test_brains.sh cargo test --lib
        server::tests::production_constructor_rejects_rewritten_proof_and_accepts_exact_restore
        -- --nocapture

    - name: Reject fixture traversal before external mutation on macOS
      if: runner.os == 'macOS'
      run: |
        ./scripts/test_brains.sh cargo test --lib supervised_http_fixture_rejects -- --nocapture
        ./scripts/test_brains.sh cargo test --lib server::tests::supervised_http_fixture_pins_state_root_across_ancestor_swap -- --exact --nocapture
        ./scripts/test_brains.sh cargo test --lib ipc::server::tests::supervised_ipc_listener_ancestor_swap_never_mutates_replacement_path -- --exact --nocapture

    - name: Exercise real Brain and server paths on macOS
      if: runner.os == 'macOS'
      run: |
        ./scripts/test_brains.sh cargo test --lib brain::store -- --nocapture
        ./scripts/test_brains.sh cargo test --lib server::brain_service -- --nocapture
        ./scripts/test_brains.sh cargo test --lib server::tests::production_constructor_persists_named_brain_only_in_isolated_home -- --exact --nocapture
        ./scripts/test_brains.sh cargo test --lib server::tests::production_constructor_rejects_unverified_environment_before_store_mutation -- --exact --nocapture
        ./scripts/test_brains.sh cargo test --test daemon_integration_test test_daemon_spawn_and_health -- --exact --ignored --nocapture

    - name: Keep worker node identity inside disposable state on macOS
      if: runner.os == 'macOS'
      run: |
        tests/worker_node_isolation_contract.sh
        ./scripts/test_brains.sh cargo test --test worker_integration_test -- --nocapture

    - name: Exercise the complete synthetic isolation harness on macOS
      if: runner.os == 'macOS'
      run: ./scripts/test_brain_isolation.sh

    - name: Build Apple Silicon release preflight on trusted main
      if: github.event_name == 'push' && runner.os == 'macOS'
      run: cargo build --release --target aarch64-apple-darwin

    - name: Upload Apple Silicon release preflight
      if: github.event_name == 'push' && runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: finch-aarch64-apple-darwin
        path: target/aarch64-apple-darwin/release/finch

    - name: Verify binary reports its version
      # Exercise Cargo's default binary selection so adding a test-only binary
      # cannot silently break the documented `cargo run -- <args>` workflow.
      run: cargo run ${{ matrix.cargo_args }} -- --version

  runtime-authority:
    name: Runtime Authority (Ubuntu)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Run runtime authority regressions
      run: cargo test --lib runtime::tests -- --nocapture

    - name: Compile all targets
      run: cargo test --all-targets --no-run

    - name: Regress scheduler and authority-use concurrency
      run: |
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::wait_rechecks_completion_after_registering_notification -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::agent_spawn_reenters_authority_to_snapshot_grants_without_deadlock -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::typed_agent_spec_attenuates_to_selected_opaque_grant -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::deferred_effect_sink_can_reenter_authority_without_deadlock -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::public_revocation_winning_before_host_use_prevents_file_mutation -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::in_flight_deferred_use_blocks_public_revoke_and_root_mutation -- --exact --nocapture

    - name: Test all targets
      run: timeout --signal=TERM --kill-after=30s 15m cargo test --all-targets -- --nocapture

  build:
    name: Build Release (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto (Ubuntu)
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        targets: x86_64-unknown-linux-gnu

    - name: Build release binary
      run: cargo build --release --target x86_64-unknown-linux-gnu

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: finch-x86_64-unknown-linux-gnu
        path: target/x86_64-unknown-linux-gnu/release/finch

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify reviewed workflow inventory
      run: |
        python3 scripts/check_ci_workflow_manifest.py
        python3 scripts/test_ci_workflow_manifest.py

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Verify resolved dependency security contract
      run: |
        python3 scripts/test_dependency_security_contract.py
        python3 scripts/check_dependency_security_contract.py

    - name: Run cargo audit
      run: cargo audit
