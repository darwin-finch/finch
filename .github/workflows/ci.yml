name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 1

jobs:
  toolchain-contract:
    name: Toolchain and formatting contract
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: rustfmt

    - name: Verify pinned toolchain and clean-checkout formatting
      run: tests/toolchain_contract.sh

  windows-format-contract:
    name: Toolchain and formatting contract (Windows)
    runs-on: windows-2025
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: rustfmt

    - name: Verify pinned Rust and rustfmt versions
      shell: pwsh
      run: |
        if (-not ((rustc --version) -like "rustc 1.98.0 *")) { exit 1 }
        if (-not ((rustfmt --version) -like "rustfmt 1.9.0-*")) { exit 1 }

    - name: Verify clean-checkout formatting
      run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.feature_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            feature_name: default
            cargo_args: ""
          - os: ubuntu-24.04
            feature_name: no-default-features
            cargo_args: --no-default-features
          - os: macos-14
            feature_name: default
            cargo_args: ""
          - os: macos-14
            feature_name: no-default-features
            cargo_args: --no-default-features

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install capnproto (macOS)
      if: runner.os == 'macOS'
      run: brew install capnp

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: clippy

    - name: Cache Cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-rust-1.98.0-${{ matrix.feature_name }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-1.98.0-${{ matrix.feature_name }}-

    - name: Detect removed-SSH API-relevant changes
      id: removed-ssh-api-paths
      shell: bash
      run: |
        base='${{ github.event.pull_request.base.sha || github.event.before }}'
        if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
          echo 'cannot identify a trustworthy comparison base; running the downstream probe' >&2
          echo 'run_probe=true' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! git fetch --no-tags --depth=1 origin "$base"; then
          echo 'cannot fetch the comparison base; running the downstream probe' >&2
          echo 'run_probe=true' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        set +e
        git diff --quiet "$base" '${{ github.sha }}' -- \
          Cargo.toml Cargo.lock build.rs src/lib.rs scripts/check_removed_ssh_api.py \
          .github/workflows/ci.yml
        diff_status=$?
        set -e
        case "$diff_status" in
          0) echo 'run_probe=false' >> "$GITHUB_OUTPUT" ;;
          1) echo 'run_probe=true' >> "$GITHUB_OUTPUT" ;;
          *)
            echo "cannot inspect removed-SSH API-relevant changes: git diff exited $diff_status; running the downstream probe" >&2
            echo 'run_probe=true' >> "$GITHUB_OUTPUT"
            ;;
        esac

    - name: Compile downstream positive controls and require removed-API diagnostics
      if: steps.removed-ssh-api-paths.outputs.run_probe == 'true'
      run: python3 scripts/check_removed_ssh_api.py ${{ matrix.cargo_args }}

    - name: Run clippy (binary only, warnings allowed for now)
      if: runner.os == 'Linux' && matrix.feature_name == 'default'
      run: cargo clippy --bin finch --all-features
      continue-on-error: true

    - name: Build binary
      run: cargo build --bin finch ${{ matrix.cargo_args }} --verbose

    - name: Compile all targets
      run: cargo test --all-targets ${{ matrix.cargo_args }} --no-run

    - name: Test all targets
      run: cargo test --all-targets ${{ matrix.cargo_args }} -- --nocapture

    - name: Verify binary reports its version
      # Exercise Cargo's default binary selection so adding a test-only binary
      # cannot silently break the documented `cargo run -- <args>` workflow.
      run: cargo run ${{ matrix.cargo_args }} -- --version

  runtime-authority:
    name: Runtime Authority (Ubuntu)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Run runtime authority regressions
      run: cargo test --lib runtime::tests -- --nocapture

    - name: Compile all targets
      run: cargo test --all-targets --no-run

    - name: Regress scheduler and authority-use concurrency
      run: |
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::wait_rechecks_completion_after_registering_notification -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::agent_spawn_reenters_authority_to_snapshot_grants_without_deadlock -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::typed_agent_spec_attenuates_to_selected_opaque_grant -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::deferred_effect_sink_can_reenter_authority_without_deadlock -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::public_revocation_winning_before_host_use_prevents_file_mutation -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::in_flight_deferred_use_blocks_public_revoke_and_root_mutation -- --exact --nocapture

    - name: Test all targets
      run: timeout --signal=TERM --kill-after=30s 15m cargo test --all-targets -- --nocapture

  build:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # x86_64-apple-darwin is unsupported: ort has no prebuilt binary,
          # and GitHub no longer provides Intel macOS runners.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install capnproto (macOS)
      if: runner.os == 'macOS'
      run: brew install capnp

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        targets: ${{ matrix.target }}

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: finch-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/finch

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install workflow parser
      run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

    - name: Check pull-request workflow fan-out
      run: python3 scripts/check_workflow_fanout.py

    - name: Run workflow fan-out mutation regressions
      run: python3 scripts/test_workflow_fanout.py

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Verify resolved HTTP dependency contract
      run: |
        cargo generate-lockfile
        python3 scripts/test_http_dependency_contract.py
        python3 scripts/check_http_dependency_contract.py

    - name: Prove removed SSH and RSA packages stay out of the resolved graph
      shell: bash
      run: |
        printf '%s\n' \
          'RUSTSEC-2026-0154 remains unreachable because russh is absent' \
          'RUSTSEC-2026-0153 remains unreachable because russh-cryptovec is absent' \
          'RUSTSEC-2023-0071 remains unreachable because rsa is absent'
        if grep -Eq '^name = "(rsa|russh|russh-cryptovec|russh-keys)"$' Cargo.lock; then
          echo 'A removed SSH or RSA package returned to Cargo.lock' >&2
          grep -nE '^name = "(rsa|russh|russh-cryptovec|russh-keys)"$' Cargo.lock >&2
          exit 1
        fi

    - name: Prove the quick-xml floor excludes both historical advisories
      shell: bash
      run: |
        cargo tree --invert quick-xml --edges normal,build,dev --prefix none --format '{p}' \
          | sort -u | tee quick-xml-tree.txt
        printf '%s\n' \
          'RUSTSEC-2026-0194 is excluded by quick-xml >= 0.41.0' \
          'RUSTSEC-2026-0195 is excluded by quick-xml >= 0.41.0'
        minimum=0.41.0
        found=$(sed -n 's/^quick-xml v\([0-9][0-9.]*\).*/\1/p' quick-xml-tree.txt | sort -u)
        if [[ -z "$found" ]]; then
          echo 'no quick-xml in the graph; the advisory assertion would be vacuous' >&2
          exit 1
        fi
        for version in $found; do
          oldest=$(printf '%s\n%s\n' "$version" "$minimum" | sort -V | head -n1)
          if [[ "$oldest" == "$version" && "$version" != "$minimum" ]]; then
            echo "quick-xml $version is below the fixed $minimum and is still reachable" >&2
            exit 1
          fi
          echo "quick-xml $version is at or above the fixed $minimum"
        done

    - name: Run the one full Cargo audit and retain named advisory diagnostics
      shell: bash
      run: |
        set +e
        cargo audit --json > audit.json
        audit_status=$?
        set -e
        if (( audit_status != 0 && audit_status != 1 )); then
          echo "cargo-audit exited unexpectedly with status ${audit_status}" >&2
          exit 1
        fi
        test -s audit.json
        jq -e 'type == "object" and (.vulnerabilities.list | type == "array")' audit.json >/dev/null
        jq -r '.vulnerabilities.list[]? | [.advisory.id, .package.name, .package.version] | @tsv' audit.json
        jq -e '
          [.vulnerabilities.list[]?]
          | all(
              .advisory.id != "RUSTSEC-2026-0194"
              and .advisory.id != "RUSTSEC-2026-0195"
              and .advisory.id != "RUSTSEC-2026-0154"
              and .advisory.id != "RUSTSEC-2026-0153"
              and .advisory.id != "RUSTSEC-2023-0071"
              and .package.name != "rsa"
              and .package.name != "russh"
              and .package.name != "russh-cryptovec"
              and .package.name != "russh-keys"
            )
        ' audit.json
        if (( audit_status != 0 )); then
          echo "cargo audit found advisories outside the five permanent focused guards" >&2
          exit "$audit_status"
        fi
