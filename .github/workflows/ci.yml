name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 1

jobs:
  toolchain-contract:
    name: Toolchain and formatting contract
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      with:
        components: rustfmt

    - name: Verify pinned toolchain and clean-checkout formatting
      run: tests/toolchain_contract.sh

    - name: Verify canonical CI cache contract
      run: |
        python3 scripts/test_ci_cache_contract.py
        ruby scripts/check_ci_cache_contract.rb

  windows-format-contract:
    name: Toolchain and formatting contract (Windows)
    runs-on: windows-2025
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      with:
        components: rustfmt

    - name: Verify pinned Rust and rustfmt versions
      shell: pwsh
      run: |
        if (-not ((rustc --version) -like "rustc 1.98.0 *")) { exit 1 }
        if (-not ((rustfmt --version) -like "rustfmt 1.9.0-*")) { exit 1 }

    - name: Verify clean-checkout formatting
      run: cargo fmt --all -- --check

  # GitHub's repository cache quota is 10 GiB. Four former target-tree caches
  # already measured 10,965,750,437 bytes and took 66-72 seconds to transfer.
  # Keep only Cargo's compressed crate archives and bare git databases here.
  # Cargo.lock is tracked, so an exact lookup happens before any online Cargo
  # operation. Producers never restore a fallback or save a cumulative union.
  cargo-download-cache:
    name: Populate exact Cargo downloads (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0

    - name: Configure isolated Cargo download home
      run: scripts/configure_ci_cargo_home.sh

    - name: Look up exact Cargo downloads
      id: cargo-downloads
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: |
          ${{ runner.temp }}/finch-cargo-home/registry/cache
          ${{ runner.temp }}/finch-cargo-home/git/db
        key: cargo-downloads-v2-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('Cargo.lock') }}
        lookup-only: true

    # RUNNER_TEMP starts empty, so a new exact key cannot inherit removed
    # crates from an older dependency generation.
    - name: Fetch complete exact dependency archive on cache miss
      if: steps.cargo-downloads.outputs.cache-hit != 'true'
      run: cargo fetch --locked --verbose

    - name: Save complete exact Cargo downloads
      if: steps.cargo-downloads.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: |
          ${{ runner.temp }}/finch-cargo-home/registry/cache
          ${{ runner.temp }}/finch-cargo-home/git/db
        key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.feature_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            feature_name: default
            cargo_args: ""
          - os: ubuntu-24.04
            feature_name: no-default-features
            cargo_args: --no-default-features
          - os: macos-14
            feature_name: default
            cargo_args: ""
          - os: macos-14
            feature_name: no-default-features
            cargo_args: --no-default-features

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install capnproto (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install capnproto (macOS)
      if: runner.os == 'macOS'
      run: brew install capnp

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      with:
        components: clippy

    - name: Configure isolated Cargo download home
      run: scripts/configure_ci_cargo_home.sh

    - name: Restore exact Cargo downloads
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: |
          ${{ runner.temp }}/finch-cargo-home/registry/cache
          ${{ runner.temp }}/finch-cargo-home/git/db
        key: cargo-downloads-v2-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v2-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    # Compiler objects are never restored into PR jobs. Trusted main test lanes
    # may reuse this local cache, but only the default-feature lane saves it.
    - name: Identify native compiler inputs
      id: native-cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: python3 scripts/ci_native_cache_key.py

    - name: Restore bounded local compiler objects
      id: sccache-local
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/finch-sccache-cache
        key: sccache-local-v3-${{ runner.os }}-profile-debug-cap-256m-sccache-0.17.0-rust-1.98.0-native-${{ steps.native-cache.outputs.digest }}-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          sccache-local-v3-${{ runner.os }}-profile-debug-cap-256m-sccache-0.17.0-rust-1.98.0-native-${{ steps.native-cache.outputs.digest }}-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    - name: Configure fixed-digest local compiler cache
      id: sccache-config
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: scripts/configure_ci_sccache.sh

    - name: Run clippy (binary only, warnings allowed for now)
      if: runner.os == 'Linux' && matrix.feature_name == 'default'
      run: cargo clippy --locked --bin finch --all-features
      continue-on-error: true

    - name: Build binary
      run: cargo build --locked --bin finch ${{ matrix.cargo_args }} --verbose

    - name: Compile all targets
      run: cargo test --locked --all-targets ${{ matrix.cargo_args }} --no-run

    - name: Test all targets
      run: cargo test --locked --all-targets ${{ matrix.cargo_args }} -- --nocapture

    - name: Verify binary reports its version
      # Exercise Cargo's default binary selection so adding a test-only binary
      # cannot silently break the documented `cargo run -- <args>` workflow.
      run: cargo run --locked ${{ matrix.cargo_args }} -- --version

    - name: Stop and measure local compiler cache
      id: sccache-stop
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: scripts/stop_ci_sccache.sh

    - name: Save bounded local compiler objects
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.feature_name == 'default' && steps.sccache-local.outputs.cache-hit != 'true' && steps.sccache-stop.outputs.save-ready == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/finch-sccache-cache
        key: ${{ steps.sccache-local.outputs.cache-primary-key }}

  runtime-authority:
    name: Runtime Authority (Ubuntu)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install capnproto
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0

    - name: Configure isolated Cargo download home
      run: scripts/configure_ci_cargo_home.sh

    - name: Restore exact Cargo downloads
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: |
          ${{ runner.temp }}/finch-cargo-home/registry/cache
          ${{ runner.temp }}/finch-cargo-home/git/db
        key: cargo-downloads-v2-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v2-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    - name: Identify native compiler inputs
      id: native-cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: python3 scripts/ci_native_cache_key.py

    - name: Restore bounded local compiler objects
      id: sccache-local
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/finch-sccache-cache
        key: sccache-local-v3-${{ runner.os }}-profile-debug-cap-256m-sccache-0.17.0-rust-1.98.0-native-${{ steps.native-cache.outputs.digest }}-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          sccache-local-v3-${{ runner.os }}-profile-debug-cap-256m-sccache-0.17.0-rust-1.98.0-native-${{ steps.native-cache.outputs.digest }}-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    - name: Configure fixed-digest local compiler cache
      id: sccache-config
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: scripts/configure_ci_sccache.sh

    - name: Run runtime authority regressions
      run: cargo test --locked --lib runtime::tests -- --nocapture

    - name: Compile all targets
      run: cargo test --locked --all-targets --no-run

    - name: Regress scheduler and authority-use concurrency
      run: |
        timeout --signal=TERM --kill-after=10s 2m cargo test --locked --lib runtime::scheduler::tests::wait_rechecks_completion_after_registering_notification -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --locked --lib runtime::scheduler::tests::agent_spawn_reenters_authority_to_snapshot_grants_without_deadlock -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --locked --lib runtime::scheduler::tests::typed_agent_spec_attenuates_to_selected_opaque_grant -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --locked --lib runtime::tests::deferred_effect_sink_can_reenter_authority_without_deadlock -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --locked --lib runtime::tests::public_revocation_winning_before_host_use_prevents_file_mutation -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --locked --lib runtime::tests::in_flight_deferred_use_blocks_public_revoke_and_root_mutation -- --exact --nocapture

    - name: Test all targets
      run: timeout --signal=TERM --kill-after=30s 15m cargo test --locked --all-targets -- --nocapture

    - name: Stop and measure local compiler cache
      id: sccache-stop
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: scripts/stop_ci_sccache.sh

  build:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      # Match the tag workflow's release compiler arguments.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # x86_64-apple-darwin is unsupported: ort has no prebuilt binary,
          # and GitHub no longer provides Intel macOS runners.

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install capnproto (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install capnproto (macOS)
      if: runner.os == 'macOS'
      run: brew install capnp

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      with:
        targets: ${{ matrix.target }}

    - name: Configure isolated Cargo download home
      run: scripts/configure_ci_cargo_home.sh

    - name: Restore exact Cargo downloads
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: |
          ${{ runner.temp }}/finch-cargo-home/registry/cache
          ${{ runner.temp }}/finch-cargo-home/git/db
        key: cargo-downloads-v2-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v2-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    - name: Identify native compiler inputs
      id: native-cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: python3 scripts/ci_native_cache_key.py

    - name: Restore bounded local compiler objects
      id: sccache-local
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/finch-sccache-cache
        key: sccache-local-v3-${{ runner.os }}-profile-release-lto-false-codegen-16-target-${{ matrix.target }}-cap-256m-sccache-0.17.0-rust-1.98.0-native-${{ steps.native-cache.outputs.digest }}-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          sccache-local-v3-${{ runner.os }}-profile-release-lto-false-codegen-16-target-${{ matrix.target }}-cap-256m-sccache-0.17.0-rust-1.98.0-native-${{ steps.native-cache.outputs.digest }}-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    - name: Configure fixed-digest local compiler cache
      id: sccache-config
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: scripts/configure_ci_sccache.sh

    - name: Build release binary
      run: cargo build --locked --release --target ${{ matrix.target }}

    - name: Stop and measure local compiler cache
      id: sccache-stop
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: scripts/stop_ci_sccache.sh

    - name: Save bounded local compiler objects
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sccache-local.outputs.cache-hit != 'true' && steps.sccache-stop.outputs.save-ready == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/finch-sccache-cache
        key: ${{ steps.sccache-local.outputs.cache-primary-key }}

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: finch-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/finch

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0

    - name: Configure isolated Cargo download home
      run: scripts/configure_ci_cargo_home.sh

    - name: Restore exact Cargo downloads
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: |
          ${{ runner.temp }}/finch-cargo-home/registry/cache
          ${{ runner.temp }}/finch-cargo-home/git/db
        key: cargo-downloads-v2-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v2-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    # The fixed-digest 6.55 MB RustSec release avoids compiling cargo-audit in
    # every PR without exposing any cache-service write credential.
    - name: Install fixed-digest cargo-audit
      run: scripts/configure_ci_cargo_audit.sh

    - name: Verify pinned cargo-audit executable
      run: |
        actual=$(cargo-audit --version)
        if [[ "$actual" != "cargo-audit 0.22.2" ]]; then
          echo "expected cargo-audit 0.22.2, found: $actual" >&2
          exit 1
        fi

    - name: Verify resolved HTTP dependency contract
      run: |
        python3 scripts/test_http_dependency_contract.py
        python3 scripts/check_http_dependency_contract.py

    - name: Run cargo audit
      run: cargo audit
