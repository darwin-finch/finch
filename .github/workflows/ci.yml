name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GitHub scopes pull_request caches to the merge ref, including fork PRs, so
# they may read main's cache but cannot replace it. Keep workflow privileges
# minimal because cached build outputs are restored before repository code runs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 1

jobs:
  toolchain-contract:
    name: Toolchain and formatting contract
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: rustfmt

    - name: Verify canonical CI cache coverage
      run: python3 scripts/test_ci_cache_contract.py

    - name: Verify pinned toolchain and clean-checkout formatting
      run: tests/toolchain_contract.sh

  windows-format-contract:
    name: Toolchain and formatting contract (Windows)
    runs-on: windows-2025
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: rustfmt

    - name: Verify pinned Rust and rustfmt versions
      shell: pwsh
      run: |
        if (-not ((rustc --version) -like "rustc 1.98.0 *")) { exit 1 }
        if (-not ((rustfmt --version) -like "rustfmt 1.9.0-*")) { exit 1 }

    - name: Verify clean-checkout formatting
      run: cargo fmt --all -- --check

  # Four live target caches measured 10,965,750,437 bytes, already beyond
  # GitHub's free 10 GiB repository quota; restore/save alone took 66-72s.
  # Cargo's recommended non-duplicated paths measured about 260 MiB locally.
  # Keep five bounded keys per dependency generation (2 OS x 2 layers + the
  # Linux audit tool), not target outputs, extracted sources, or native ORT.
  # Older generations remain until GitHub's quota-driven LRU eviction; cold
  # and warm CI evidence must confirm the smaller entries do not still thrash.
  # One trusted producer per OS populates a complete immutable download set.
  # PR jobs restore these caches but never save into their own merge-ref scope.
  cargo-download-cache:
    name: Populate Cargo downloads (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Restore Cargo registry index bootstrap
      id: cargo-resolution
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/index
        key: cargo-resolution-v1-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-manifests-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-resolution-v1-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-manifests-

    # The manifest-keyed bootstrap is deliberately only a hint. Its immutable
    # entry cannot absorb later registry changes under the same manifests, but
    # Cargo revalidates it before resolving. The archive layer is then keyed by
    # that run's newly generated lock, so stale index data cannot select a
    # wrong exact download cache.
    - name: Resolve Cargo dependency graph
      run: cargo generate-lockfile

    - name: Restore resolved Cargo downloads
      id: cargo-downloads
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-downloads-v3-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v3-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    # Without --target, Cargo fetches the lockfile's dependencies for all
    # targets. This is the only writer, so a narrower job cannot freeze a
    # partial immutable cache under the shared key.
    - name: Fetch the complete dependency graph
      run: cargo fetch --verbose

    - name: Save Cargo registry index bootstrap
      if: steps.cargo-resolution.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/index
        key: ${{ steps.cargo-resolution.outputs.cache-primary-key }}

    - name: Save complete Cargo downloads
      if: steps.cargo-downloads.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}

  # Successful CI run 34078078044 spent about 6m24s installing cargo-audit
  # 0.22.2. Pin that crates.io --locked input; only trusted main builds/saves
  # it. PRs restore it or perform an ordinary, unsaved fallback installation.
  cargo-audit-cache:
    name: Populate pinned cargo-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Restore pinned cargo-audit
      id: cargo-audit
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/bin/cargo-audit
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
        key: cargo-tool-v1-${{ runner.os }}-ubuntu-24.04-rust-1.98.0-cargo-audit-0.22.2

    - name: Install pinned cargo-audit on cache miss
      if: steps.cargo-audit.outputs.cache-hit != 'true'
      run: cargo install cargo-audit --version 0.22.2 --locked

    - name: Verify pinned cargo-audit
      run: |
        actual=$(cargo-audit --version)
        if [[ "$actual" != "cargo-audit 0.22.2" ]]; then
          echo "expected trusted cargo-audit 0.22.2, found: $actual" >&2
          exit 1
        fi

    - name: Save pinned cargo-audit
      if: steps.cargo-audit.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/bin/cargo-audit
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
        key: ${{ steps.cargo-audit.outputs.cache-primary-key }}

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.feature_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            feature_name: default
            cargo_args: ""
          - os: ubuntu-24.04
            feature_name: no-default-features
            cargo_args: --no-default-features
          - os: macos-14
            feature_name: default
            cargo_args: ""
          - os: macos-14
            feature_name: no-default-features
            cargo_args: --no-default-features

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install capnproto (macOS)
      if: runner.os == 'macOS'
      run: brew install capnp

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        components: clippy

    - name: Restore Cargo registry index bootstrap
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/index
        key: cargo-resolution-v1-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-manifests-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-resolution-v1-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-manifests-

    - name: Resolve Cargo dependency graph
      run: cargo generate-lockfile

    - name: Restore resolved Cargo downloads
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-downloads-v3-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v3-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    - name: Run clippy (binary only, warnings allowed for now)
      if: runner.os == 'Linux' && matrix.feature_name == 'default'
      run: cargo clippy --bin finch --all-features
      continue-on-error: true

    - name: Build binary
      run: cargo build --bin finch ${{ matrix.cargo_args }} --verbose

    - name: Compile all targets
      run: cargo test --all-targets ${{ matrix.cargo_args }} --no-run

    - name: Test all targets
      run: cargo test --all-targets ${{ matrix.cargo_args }} -- --nocapture

    - name: Verify binary reports its version
      # Exercise Cargo's default binary selection so adding a test-only binary
      # cannot silently break the documented `cargo run -- <args>` workflow.
      run: cargo run ${{ matrix.cargo_args }} -- --version

  runtime-authority:
    name: Runtime Authority (Ubuntu)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Restore Cargo registry index bootstrap
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/index
        key: cargo-resolution-v1-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-manifests-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-resolution-v1-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-manifests-

    - name: Resolve Cargo dependency graph
      run: cargo generate-lockfile

    - name: Restore resolved Cargo downloads
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-downloads-v3-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v3-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    - name: Run runtime authority regressions
      run: cargo test --lib runtime::tests -- --nocapture

    - name: Compile all targets
      run: cargo test --all-targets --no-run

    - name: Regress scheduler and authority-use concurrency
      run: |
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::wait_rechecks_completion_after_registering_notification -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::agent_spawn_reenters_authority_to_snapshot_grants_without_deadlock -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::scheduler::tests::typed_agent_spec_attenuates_to_selected_opaque_grant -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::deferred_effect_sink_can_reenter_authority_without_deadlock -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::public_revocation_winning_before_host_use_prevents_file_mutation -- --exact --nocapture
        timeout --signal=TERM --kill-after=10s 2m cargo test --lib runtime::tests::in_flight_deferred_use_blocks_public_revoke_and_root_mutation -- --exact --nocapture

    - name: Test all targets
      run: timeout --signal=TERM --kill-after=30s 15m cargo test --all-targets -- --nocapture

  build:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # x86_64-apple-darwin is unsupported: ort has no prebuilt binary,
          # and GitHub no longer provides Intel macOS runners.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install capnproto (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y capnproto

    - name: Install capnproto (macOS)
      if: runner.os == 'macOS'
      run: brew install capnp

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        targets: ${{ matrix.target }}

    - name: Restore Cargo registry index bootstrap
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/index
        key: cargo-resolution-v1-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-manifests-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-resolution-v1-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-manifests-

    - name: Resolve Cargo dependency graph
      run: cargo generate-lockfile

    - name: Restore resolved Cargo downloads
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-downloads-v3-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v3-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: finch-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/finch

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install repository Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.0

    - name: Restore Cargo registry index bootstrap
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/index
        key: cargo-resolution-v1-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-manifests-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-resolution-v1-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-manifests-

    - name: Resolve Cargo dependency graph
      run: cargo generate-lockfile

    - name: Restore resolved Cargo downloads
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-downloads-v3-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v3-${{ runner.os }}-rust-1.98.0-config-${{ hashFiles('rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}-lock-

    - name: Restore pinned cargo-audit
      id: cargo-audit
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ~/.cargo/bin/cargo-audit
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
        key: cargo-tool-v1-${{ runner.os }}-ubuntu-24.04-rust-1.98.0-cargo-audit-0.22.2

    - name: Install pinned cargo-audit on cache miss
      if: steps.cargo-audit.outputs.cache-hit != 'true'
      run: cargo install cargo-audit --version 0.22.2 --locked

    - name: Verify pinned cargo-audit
      run: |
        actual=$(cargo-audit --version)
        if [[ "$actual" != "cargo-audit 0.22.2" ]]; then
          echo "expected trusted cargo-audit 0.22.2, found: $actual" >&2
          exit 1
        fi

    - name: Verify resolved HTTP dependency contract
      run: |
        python3 scripts/test_http_dependency_contract.py
        python3 scripts/check_http_dependency_contract.py

    - name: Run cargo audit
      run: cargo audit
