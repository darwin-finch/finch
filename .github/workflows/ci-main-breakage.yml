# Trusted default-branch controller for main-branch CI breakage visibility.
# The release preflight, the release-mode atomic history regression, and the
# macOS suite run only on trusted main (#848): a red main push is the only
# detection point for those regressions, so it must be loud. This controller
# runs from the default branch on trusted workflow_run events, never from PR
# code. One open "CI failed on main" issue is kept (residual list-to-create
# TOCTOU is acknowledged, not claimed atomic); it collects a comment per
# failing main push and closes when CI on main passes again.
name: CI main breakage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  report-main-breakage:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Update the main breakage issue
        env:
          TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          ISSUE_TITLE = "CI failed on main"
          LABEL = "ci-main-breakage"
          PAGE_SIZE = 100
          MAX_API_REQUESTS = 12
          MAX_RESPONSE_BYTES = 2 * 1024 * 1024
          request_count = 0

          def fail(message):
              raise RuntimeError(message)

          def integer(value, label):
              if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
                  fail(f"{label} must be a positive integer; found {value!r}")
              return value

          def api(method, path, expected=(200, 201), payload=None):
              global request_count
              request_count += 1
              if request_count > MAX_API_REQUESTS:
                  fail(f"API request cap exceeded ({MAX_API_REQUESTS})")
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  api_url + path,
                  data=body,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
                      raw = response.read(MAX_RESPONSE_BYTES + 1)
              except urllib.error.HTTPError as error:
                  if error.code not in expected:
                      fail(f"API {method} {path} returned HTTP {error.code}")
                  status = error.code
                  raw = error.read(MAX_RESPONSE_BYTES + 1)
              except urllib.error.URLError as error:
                  fail(f"API {method} {path} failed: {error.reason}")
              if status not in expected:
                  fail(f"API {method} {path} returned unexpected HTTP {status}")
              if len(raw) > MAX_RESPONSE_BYTES:
                  fail(f"API {method} {path} exceeded the response-size bound")
              try:
                  return json.loads(raw)
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  fail(f"API {method} {path} returned malformed JSON: {error}")

          def validate_head_sha(value, label):
              if not isinstance(value, str) or re.fullmatch(r"[0-9a-fA-F]{40}", value) is None:
                  fail(f"{label} is not a 40-digit hexadecimal SHA")
              return value.lower()

          def open_breakage_issues():
              data = api(
                  "GET",
                  f"/repos/{repo}/issues?labels={LABEL}&state=open&per_page={PAGE_SIZE}",
              )
              if not isinstance(data, list):
                  fail("open issue listing must be an array")
              return [
                  issue for issue in data
                  if isinstance(issue, dict)
                  and issue.get("pull_request") is None
                  and issue.get("title") == ISSUE_TITLE
              ]

          def failed_job_names():
              data = api(
                  "GET",
                  f"/repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page={PAGE_SIZE}",
              )
              jobs = data.get("jobs") if isinstance(data, dict) else None
              if not isinstance(jobs, list) or not jobs:
                  fail("failed run job listing is invalid")
              names = [
                  job.get("name") for job in jobs
                  if isinstance(job, dict) and job.get("conclusion") == "failure"
              ]
              names = [name for name in names if isinstance(name, str) and name]
              if not names:
                  fail("the triggering run failed but no failed job was found")
              return names

          def failure_report(kind):
              return "\n".join([
                  f"CI on main {kind}.",
                  "",
                  "Failed jobs:",
                  *(f"- {name}" for name in failed_job_names()),
                  "",
                  f"Run: {run_url}",
                  f"Commit: {head_sha}",
                  f"Observed: {datetime.now(timezone.utc).isoformat()}",
              ])

          try:
              event_path = os.environ["GITHUB_EVENT_PATH"]
              api_url = os.environ["GITHUB_API_URL"].rstrip("/")
              token = os.environ["TOKEN"]
              if not api_url or not token:
                  fail("GITHUB_API_URL and TOKEN must be nonempty")
              with open(event_path, "rb") as stream:
                  raw_event = stream.read(1024 * 1024 + 1)
              if len(raw_event) > 1024 * 1024:
                  fail("workflow_run event exceeds the 1 MiB bound")
              event = json.loads(raw_event)
              if not isinstance(event, dict):
                  fail("event must be an object")
              payload = event.get("workflow_run")
              if not isinstance(payload, dict):
                  fail("event workflow_run must be an object")
              conclusion = payload.get("conclusion")
              if conclusion not in ("failure", "success"):
                  print(f"conclusion {conclusion!r} needs no breakage report")
                  sys.exit(0)
              if payload.get("event") != "push" or payload.get("head_branch") != "main":
                  print("non-main-push canonical CI run is outside breakage reporting")
                  sys.exit(0)
              repository = event.get("repository")
              repo = repository.get("full_name") if isinstance(repository, dict) else None
              if not isinstance(repo, str) or re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) is None:
                  fail("event repository.full_name is invalid")
              run_id = integer(payload.get("id"), "event workflow_run.id")
              run_url = payload.get("html_url")
              if not isinstance(run_url, str) or not run_url.startswith("https://github.com/"):
                  fail("event workflow_run.html_url is invalid")
              head_sha = validate_head_sha(payload.get("head_sha"), "event workflow_run.head_sha")

              label = api("GET", f"/repos/{repo}/labels/{LABEL}", expected=(200, 404))
              if not (isinstance(label, dict) and label.get("name") == LABEL):
                  api(
                      "POST",
                      f"/repos/{repo}/labels",
                      payload={
                          "name": LABEL,
                          "color": "D93F0B",
                          "description": "CI failed on trusted main",
                      },
                  )

              issues = open_breakage_issues()
              if len(issues) > 1:
                  fail(f"expected at most one open breakage issue; found {len(issues)}")

              if conclusion == "success":
                  if not issues:
                      print("CI on main passed; no open breakage issue to close")
                      sys.exit(0)
                  number = integer(issues[0].get("number"), "breakage issue number")
                  api(
                      "POST",
                      f"/repos/{repo}/issues/{number}/comments",
                      payload={
                          "body": (
                              "CI on main passed again.\n\n"
                              f"Run: {run_url}\nCommit: {head_sha}\n\n"
                              "Closing this issue; it reopens if main breaks later."
                          )
                      },
                  )
                  api(
                      "PATCH",
                      f"/repos/{repo}/issues/{number}",
                      payload={"state": "closed", "state_reason": "completed"},
                  )
                  print(f"closed breakage issue {number}")
                  sys.exit(0)

              report = failure_report("failed")
              if issues:
                  number = integer(issues[0].get("number"), "breakage issue number")
                  api(
                      "POST",
                      f"/repos/{repo}/issues/{number}/comments",
                      payload={"body": report},
                  )
                  print(f"reported failure on existing breakage issue {number}")
                  sys.exit(0)

              body = "\n".join([
                  report,
                  "",
                  "This issue is filed and closed automatically by",
                  ".github/workflows/ci-main-breakage.yml, a trusted main-branch",
                  "controller. Every failed main push adds a comment; the issue",
                  "closes when CI on main passes again.",
              ])
              created = api(
                  "POST",
                  f"/repos/{repo}/issues",
                  payload={"title": ISSUE_TITLE, "body": body, "labels": [LABEL]},
              )
              number = integer(created.get("number"), "created breakage issue number")
              print(f"filed breakage issue {number}")
          except (KeyError, OSError, ValueError, RuntimeError, json.JSONDecodeError) as error:
              print(f"main breakage reporting failed closed: {error}", file=sys.stderr)
              sys.exit(1)
          PYTHON
