name: Issue 202 ChatGPT catalog compatibility

on:
  push:
    branches:
      - codex/issue-202-live-catalog-version
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-202-live-catalog-version-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  catalog-compatibility:
    name: Catalog compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact branch tip
        uses: actions/checkout@v4

      - name: Install Cap'n Proto compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install Cap'n Proto compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - name: Cache Cargo inputs and outputs
        uses: Swatinem/rust-cache@v2

      - name: Check focused formatting
        run: rustfmt --edition 2021 --check src/providers/chatgpt_subscription.rs

      - name: Compile library tests
        run: cargo test --lib --no-run

      - name: Run ChatGPT subscription protocol regressions
        run: cargo test --lib providers::chatgpt_subscription::tests:: -- --nocapture
