name: Issue 201 ChatGPT Auth

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/lib.rs"
      - "src/oauth/**"
      - "src/config/**"
      - "src/providers/chatgpt_oauth.rs"
      - "src/providers/model_catalog.rs"
      - "src/providers/openai_jwks.rs"
      - "src/providers/mod.rs"
      - "src/cli/chatgpt_auth.rs"
      - "src/cli/setup_wizard.rs"
      - "src/main.rs"
      - "docs/OAUTH.md"
      - ".github/issue-105-windows-probe/**"
      - ".github/issue-201-windows-probe/**"
      - ".github/workflows/issue-201-chatgpt-auth.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/lib.rs"
      - "src/oauth/**"
      - "src/config/**"
      - "src/providers/chatgpt_oauth.rs"
      - "src/providers/model_catalog.rs"
      - "src/providers/openai_jwks.rs"
      - "src/providers/mod.rs"
      - "src/cli/chatgpt_auth.rs"
      - "src/cli/setup_wizard.rs"
      - "src/main.rs"
      - "docs/OAUTH.md"
      - ".github/issue-105-windows-probe/**"
      - ".github/issue-201-windows-probe/**"
      - ".github/workflows/issue-201-chatgpt-auth.yml"

jobs:
  windows-verifier-compile:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Compile exact authentication sources on Windows
        run: |
          cargo check --manifest-path .github/issue-105-windows-probe/Cargo.toml
          cargo check --manifest-path .github/issue-201-windows-probe/Cargo.toml
