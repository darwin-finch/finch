name: Issue 201 ChatGPT Auth

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/oauth/**"
      - "src/config/**"
      - "src/providers/chatgpt_oauth.rs"
      - "src/providers/openai_jwks.rs"
      - "src/cli/chatgpt_auth.rs"
      - "src/cli/setup_wizard.rs"
      - "src/main.rs"
      - "docs/OAUTH.md"
      - ".github/issue-201-windows-probe/**"
      - ".github/workflows/issue-201-chatgpt-auth.yml"

jobs:
  focused-auth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Cap'n Proto compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Install Cap'n Proto compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check focused formatting
        run: >-
          rustfmt --edition 2021 --check
          src/oauth/mod.rs src/oauth/file_store.rs src/oauth/tests.rs
          src/providers/chatgpt_oauth.rs src/providers/openai_jwks.rs
          src/cli/chatgpt_auth.rs src/cli/setup_wizard.rs src/main.rs
      - name: Compile library and binary tests
        run: cargo test --no-run
      - name: Provider-neutral OAuth regressions
        run: "cargo test --lib oauth::"
      - name: OpenAI signed-token regressions
        run: "cargo test --lib providers::chatgpt_oauth::"
      - name: JWKS authority regressions
        run: "cargo test --lib providers::openai_jwks::"
      - name: Auth UX regressions
        run: "cargo test --lib cli::chatgpt_auth::"
      - name: Scriptable auth parser regressions
        run: "cargo test --bin finch chatgpt_auth_cli_"
      - name: Shared setup auth regressions
        run: cargo test --lib cli::setup_wizard::tests::setup_
      - name: Setup entry-point reuse regression
        run: cargo test --lib cli::setup_wizard::tests::first_run_command_and_repl

  windows-verifier-compile:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Compile exact OAuth and OpenAI verifier sources on Windows
        run: cargo check --manifest-path .github/issue-201-windows-probe/Cargo.toml
