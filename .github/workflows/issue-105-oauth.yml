name: Issue 105 OAuth

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "src/lib.rs"
      - "src/oauth/**"
      - "src/providers/chatgpt_oauth.rs"
      - "src/providers/mod.rs"
      - ".github/workflows/issue-105-oauth.yml"

jobs:
  oauth:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Cap'n Proto compiler
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check focused formatting
        run: rustfmt --edition 2021 --check src/oauth/mod.rs src/oauth/file_store.rs src/oauth/tests.rs src/providers/chatgpt_oauth.rs
      - name: Compile library tests
        run: cargo test --lib --no-run
      - name: Provider-neutral OAuth regressions
        run: "cargo test --lib oauth::"
      - name: ChatGPT OAuth adapter regressions
        run: "cargo test --lib providers::chatgpt_oauth::"

  windows-compile:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Cap'n Proto compiler
        run: choco install capnproto --yes --no-progress
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile provider-neutral OAuth core on Windows
        run: cargo check --manifest-path .github/issue-105-windows-probe/Cargo.toml

  macos-oauth:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Cap'n Proto compiler
        run: brew install capnp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check focused formatting
        run: rustfmt --edition 2021 --check src/oauth/mod.rs src/oauth/file_store.rs src/oauth/tests.rs src/providers/chatgpt_oauth.rs
      - name: Compile library tests
        run: cargo test --lib --no-run
      - name: Provider-neutral OAuth regressions
        run: "cargo test --lib oauth::"
      - name: ChatGPT OAuth adapter regressions
        run: "cargo test --lib providers::chatgpt_oauth::"
