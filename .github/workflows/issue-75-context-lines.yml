name: Issue 75 context lines

on:
  pull_request:
    branches: [main]
    paths:
      - "src/cli/setup_wizard.rs"
      - "src/cli/repl_event/event_loop.rs"
      - "src/cli/repl_event/query_processor.rs"
      - "src/cli/status_bar.rs"
      - "src/config/settings.rs"
      - ".github/workflows/issue-75-context-lines.yml"
  push:
    branches: [main]
    paths:
      - "src/cli/setup_wizard.rs"
      - "src/cli/repl_event/event_loop.rs"
      - "src/cli/repl_event/query_processor.rs"
      - "src/cli/status_bar.rs"
      - "src/config/settings.rs"
      - ".github/workflows/issue-75-context-lines.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: issue-75-context-lines-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  focused-context-lines:
    name: Context-lines regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - name: Install Cap'n Proto compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Install Cap'n Proto compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check scoped formatting
        run: >-
          rustfmt --edition 2021 --check
          src/cli/setup_wizard.rs
          src/cli/repl_event/event_loop.rs
          src/cli/repl_event/query_processor.rs
          src/cli/status_bar.rs
          src/config/settings.rs
      - name: Compile library regressions
        run: cargo test --lib --no-run
      - name: Settings navigation and narrow-terminal regressions
        run: |
          cargo test --lib cli::setup_wizard::tests::test_context_lines_selected_row_owns_left_right_across_full_range -- --exact
          cargo test --lib cli::setup_wizard::tests::test_context_lines_selected_row_is_discoverable_on_narrow_terminals -- --exact
      - name: Three-entry-point persistence regression
        run: cargo test --lib cli::setup_wizard::tests::test_context_lines_save_and_reopen_through_all_setup_invocations -- --exact
      - name: Runtime status-strip budget regression
        run: |
          cargo test --lib cli::repl_event::query_processor::tests::test_context_strip_uses_selected_budget_and_removes_stale_rows -- --exact
          cargo test --lib cli::repl_event::query_processor::tests::test_semantic_refresh_cannot_erase_active_brain_until_explicit_release -- --exact
          cargo test --lib cli::repl_event::event_loop::tests::canonical_brain_context_replaces_semantic_rows_within_one_budget -- --exact
      - name: Configuration bounds regression
        run: cargo test --lib config::settings::tests::test_context_lines_validation_enforces_status_strip_range -- --exact
