name: Issue 173 provider removal proof

on:
  push:
    branches:
      - codex/issue-173-remove-codex-appserver
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-173-provider-removal-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  provider-removal:
    name: Provider removal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Checkout exact branch tip
        uses: actions/checkout@v4

      - name: Install capnproto (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install capnproto (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: issue-173-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - name: Check scoped formatting
        run: |
          rustfmt --edition 2021 --check \
            src/agent/mod.rs \
            src/cli/setup_wizard.rs \
            src/config/provider.rs \
            src/config/settings.rs \
            src/main.rs \
            src/providers/factory.rs \
            src/providers/mod.rs \
            src/providers/types.rs \
            tests/no_external_provider_binary_test.rs
          # This file is byte-identical to the issue base. It has unrelated
          # pre-existing rustfmt drift, so tolerate rustfmt failure only while
          # its exact base blob remains unchanged.
          rustfmt --edition 2021 --check src/cli/repl_event/event_loop.rs || \
            test "$(git hash-object src/cli/repl_event/event_loop.rs)" = \
              "07ae3a6ebb97c1b1730d60e444cd91d99ebbfe77"

      - name: Check all targets
        run: cargo check --all-targets

      - name: Prove hostile external provider binary remains inert
        run: cargo test --test no_external_provider_binary_test -- --nocapture

      - name: Run exact provider factory regressions
        run: |
          cargo test --lib providers::factory::tests::test_openai_platform_api_key_entry_remains_direct_and_unchanged -- --exact --nocapture
          cargo test --lib providers::factory::tests::test_legacy_subscription_never_accepts_platform_or_app_server_credentials -- --exact --nocapture
          cargo test --lib providers::factory::tests::test_mixed_legacy_and_grok_rejects_before_provider_construction_or_http -- --exact --nocapture
          cargo test --lib providers::factory::tests::test_saved_legacy_chatgpt_only_config_fails_with_actionable_migration -- --exact --nocapture

      - name: Run exact legacy config regressions
        run: |
          cargo test --lib config::provider::tests::legacy_chatgpt_subscription_deserializes_without_reinterpretation -- --exact --nocapture
          cargo test --lib config::provider::tests::legacy_chatgpt_subscription_accepts_missing_credential_reference -- --exact --nocapture

      - name: Run exact setup regressions
        run: |
          cargo test --lib cli::setup_wizard::tests::chooser_offers_openai_api_without_external_binary_provider -- --exact --nocapture
          cargo test --lib cli::setup_wizard::tests::manual_openai_id_survives_save_reopen_and_fallback_installation -- --exact --nocapture
          cargo test --lib cli::setup_wizard::tests::chooser_preserves_openai_api_key_and_hides_unsupported_subscription -- --exact --nocapture
          cargo test --lib cli::setup_wizard::tests::legacy_chatgpt_setup_fails_before_save -- --exact --nocapture

      - name: Run exact agent startup regression
        run: cargo test --lib agent::tests::test_saved_legacy_chatgpt_only_config_rejects_agent_startup -- --exact --nocapture
