name: Issue 158 CoreML policy

on:
  push:
    branches:
      - codex/issue-158-coreml-truth
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-158-coreml-policy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux-contract:
    name: Linux config and setup contract
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch tip
        uses: actions/checkout@v4

      - name: Install capnproto
        run: sudo apt-get install -y capnproto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: issue-158-linux-${{ hashFiles('Cargo.toml') }}

      - name: Check scoped formatting
        run: rustfmt --edition 2021 --check src/config/backend.rs src/config/settings.rs src/models/common.rs src/models/loaders/onnx.rs src/models/loaders/onnx_config.rs src/cli/setup_wizard.rs

      - name: Check non-macOS library, binaries, and tests
        run: cargo check --lib --bins --tests

      - name: Run CoreML config and setup regressions
        run: cargo test --lib coreml -- --nocapture

      - name: Run all setup entry-point persistence regression
        run: cargo test --lib test_first_run_command_and_repl_adapters_share_public_ceremony -- --nocapture

  macos-policy:
    name: macOS CoreML policy and diagnostic contract
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout exact branch tip
        uses: actions/checkout@v4

      - name: Install capnproto
        run: brew install capnp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo inputs and outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: issue-158-macos-${{ hashFiles('Cargo.toml') }}

      - name: Check macOS library, binaries, and tests
        run: cargo check --lib --bins --tests

      - name: Run CoreML policy and isolated diagnostic regressions
        run: cargo test --lib coreml -- --nocapture

      - name: Run production log-stream smoke boundary
        run: cargo test --lib test_coreml_profile_capture_production_log_stream_smoke -- --ignored --nocapture
