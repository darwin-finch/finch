name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracked-tree:
    name: Tracked tree (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the current tracked tree
        run: python3 scripts/check_repository_hygiene.py
      - name: Run repository hygiene regressions
        run: python3 scripts/test_repository_hygiene.py
      - name: Reject restoration of the removed SSH surface
        run: python3 scripts/check_no_ssh_surface.py
      - name: Run removed SSH surface regressions
        run: python3 scripts/test_no_ssh_surface.py
      - name: Verify reviewed workflow inventory
        if: runner.os == 'Linux'
        run: |
          python3 scripts/check_ci_workflow_manifest.py
          python3 scripts/test_ci_workflow_manifest.py
