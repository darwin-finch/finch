name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracked-tree:
    name: Tracked tree (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the current tracked tree
        run: python3 scripts/check_repository_hygiene.py
      - name: Run repository hygiene regressions
        run: python3 scripts/test_repository_hygiene.py
      - name: Check subsystem boundaries
        run: |
          python3 scripts/check_facade_boundaries.py
          python3 scripts/test_facade_boundaries.py
          python3 scripts/test_seam_cost.py
      - name: Verify reviewed workflow inventory
        run: |
          python3 scripts/check_ci_workflow_manifest.py
          python3 scripts/test_ci_workflow_manifest.py
