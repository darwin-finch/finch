name: Issue 196 Z.ai transport

on:
  push:
    branches: [codex/issue-196-zai]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  zai:
    name: Z.ai contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install capnproto (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Install capnproto (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: issue-196-${{ runner.os }}
      - name: Check focused formatting
        run: rustfmt --check --edition 2021 src/cli/setup_wizard.rs src/providers/model_catalog.rs
      - name: Compile all targets
        run: cargo test --all-targets --no-run
      - name: Z.ai provider, setup, and credential regressions
        run: |
          cargo test --lib providers::openai::tests::zai -- --nocapture
          cargo test --lib cli::setup_wizard::tests::zai -- --nocapture
          cargo test --lib providers::factory::tests::test_named_zai_profile_constructs_exact_model_and_rejects_cross_provider_binding -- --exact --nocapture
          cargo test --lib config::credential::tests -- --nocapture
          cargo test --lib providers::model_catalog::tests -- --nocapture
      - name: Preserve merged ChatGPT and SSH-removal boundaries
        run: |
          cargo test --lib cli::setup_wizard::tests::chatgpt_configuration_has_no_api_key_input_buffer_or_render_path -- --exact --nocapture
          python3 scripts/check_no_ssh_surface.py
          python3 scripts/check_removed_ssh_api.py
