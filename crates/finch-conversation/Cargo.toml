[package]
name = "finch-conversation"
version = "0.7.31"
publish = false
rust-version = "1.98"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0"
description = "Volatile provider conversation history, ordered tool-round staging, and snapshots"
repository = "https://github.com/darwin-finch/finch"

[dependencies]
anyhow = "1.0"
finch-providers = { path = "../finch-providers" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.8"
