[package]
name = "finch-programs"
version = "0.7.31"
publish = false
rust-version = "1.98"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0"
description = "Durable program identity, catalog, source-only compiler context, and wire corpus"
repository = "https://github.com/darwin-finch/finch"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
finch-language = { path = "../finch-language" }
finch-tools-api = { path = "../finch-tools-api" }
finch-vm = { path = "../finch-vm" }
fs2 = "0.4"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
walkdir = "2.4"

[dev-dependencies]
tempfile = "3.8"
