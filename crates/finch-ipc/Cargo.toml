[package]
name = "finch-ipc"
version = "0.7.31"
publish = false
rust-version = "1.98"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0"
description = "Domain-neutral Cap'n Proto schema, protocol, JSON-value, and Unix-socket primitives for Finch IPC"
repository = "https://github.com/darwin-finch/finch"

[dependencies]
anyhow = "1.0"
capnp = "0.24"
dirs = "5.0"
serde_json = "1.0"

[build-dependencies]
capnpc = "0.24"

[dev-dependencies]
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.0", features = ["v4"] }
