[package]
name = "finch-providers"
version = "0.7.31"
publish = false
rust-version = "1.98"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0"
description = "Provider-neutral LLM transports, OAuth, catalogs, and credential ports for Finch"
repository = "https://github.com/darwin-finch/finch"

[features]
default = ["claude", "openai", "gemini", "chatgpt", "grok_subscription"]
# Adapter features gate optional transports. They currently share HTTP/crypto
# dependencies; disabling a feature excludes that adapter's module.
claude = []
openai = []
gemini = []
chatgpt = ["openai"]
grok_subscription = ["openai"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
png = "0.17"
rand = { version = "0.8", features = ["small_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["dir", "fs", "user"] }

[dev-dependencies]
axum = { version = "0.7", features = ["tokio"] }
h2 = "0.4.16"
mockito = "1.2"
tempfile = "3.8"
toml = "0.8"
tokio = { version = "1.35", features = ["test-util", "full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[example]]
name = "custom_adapter"
required-features = ["claude"]
