[package]
name = "finch-vm"
version = "0.0.0"
publish = false
rust-version = "1.98"
edition = "2021"

[dependencies]
anyhow = "1.0"
finch-vm-core = { path = "../finch-vm-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
finch-language = { path = "../finch-language" }
