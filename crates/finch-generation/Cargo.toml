[package]
name = "finch-generation"
version = "0.7.30"
publish = false
rust-version = "1.98"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0"
description = "Provider-neutral generation contract, lifecycle, and strategy ports for Finch"
repository = "https://github.com/darwin-finch/finch"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
finch-providers = { path = "../finch-providers" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.35", features = ["test-util", "full"] }

[[example]]
name = "scripted_backend"
