[package]
name = "finch-brain"
version = "0.7.31"
publish = false
rust-version = "1.98"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0"
description = "Durable named-Brain state, credentials, isolation, scheduling, and remote client transports"
repository = "https://github.com/darwin-finch/finch"

[features]
# Cross-crate test-only access for root application integration fixtures.
# Production dependency edges do not enable this feature.
test-support = []

[dependencies]
finch-ipc = { path = "../finch-ipc" }
finch-node = { path = "../finch-node" }
finch-programs = { path = "../finch-programs" }
finch-providers = { path = "../finch-providers" }
finch-runtime = { path = "../finch-runtime" }
finch-vm = { path = "../finch-vm" }

anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
capnp = "0.24"
dirs = "5.0"
ed25519-dalek = { version = "2", features = ["serde", "rand_core", "pkcs8"] }
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
hostname = "0.4"
rand = { version = "0.8", features = ["small_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["dir", "fs", "process", "signal", "user"] }

[dev-dependencies]
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
finch-node = { path = "../finch-node", features = ["test-support"] }
finch-runtime = { path = "../finch-runtime", features = ["test-support"] }
rcgen = "0.13"
tempfile = "3.8"
tokio = { version = "1.35", features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["dir", "fs", "process", "signal", "term", "user"] }
