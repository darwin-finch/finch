[package]
name = "finch-node"
version = "0.7.31"
publish = false
rust-version = "1.98"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0"
description = "Local node identity, TLS material, machine naming, capability reporting, and work statistics"
repository = "https://github.com/darwin-finch/finch"

[features]
# Exposes certificate-validity construction only to dependent application
# tests. Production dependencies leave this disabled.
test-support = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
ed25519-dalek = { version = "2", features = ["serde", "rand_core", "pkcs8"] }
fs2 = "0.4"
hostname = "0.4"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"
tempfile = "3.8"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["dir", "fs"] }
