[package]
name = "finch"
version = "0.7.31"
# The floor Finch actually pins and tests: rust-toolchain.toml channel.
# Calamine 0.36.1 requires 1.88 (via zip 8.6); this is well above it, and
# declaring the looser number would claim support nothing here exercises.
rust-version = "1.98"
edition = "2021"
default-run = "finch"
authors = ["Darwin Finch Contributors"]
description = "Experimental terminal coding assistant with provider-backed chat, typed programs, and named Brains"
license = "LicenseRef-PolyForm-Noncommercial-1.0"
repository = "https://github.com/darwin-finch/finch"

[workspace]
members = [
    "crates/finch-brain",
    "crates/finch-coforth",
    "crates/finch-diff",
    "crates/finch-tools-api",
    "crates/finch-colisp",
    "crates/finch-conversation",
    "crates/finch-generation",
    "crates/finch-ipc",
    "crates/finch-language",
    "crates/finch-memory",
    "crates/finch-messages",
    "crates/finch-node",
    "crates/finch-programs",
    "crates/finch-providers",
    "crates/finch-routing-tree",
    "crates/finch-runtime",
    "crates/finch-theme",
    "crates/finch-tui",
    "crates/finch-ui-model",
    "crates/finch-vm",
    "crates/finch-vm-core",
]
default-members = [
    ".",
    "crates/finch-brain",
    "crates/finch-tools-api",
    "crates/finch-coforth",
    "crates/finch-diff",
    "crates/finch-colisp",
    "crates/finch-conversation",
    "crates/finch-generation",
    "crates/finch-ipc",
    "crates/finch-language",
    "crates/finch-memory",
    "crates/finch-messages",
    "crates/finch-node",
    "crates/finch-programs",
    "crates/finch-providers",
    "crates/finch-routing-tree",
    "crates/finch-runtime",
    "crates/finch-theme",
    "crates/finch-tui",
    "crates/finch-ui-model",
    "crates/finch-vm",
    "crates/finch-vm-core",
]
resolver = "2"

[dependencies]
finch-brain = { path = "crates/finch-brain" }
finch-conversation = { path = "crates/finch-conversation" }
finch-diff = { path = "crates/finch-diff" }
finch-generation = { path = "crates/finch-generation" }
finch-ipc = { path = "crates/finch-ipc" }
finch-tools-api = { path = "crates/finch-tools-api" }
finch-language = { path = "crates/finch-language" }
finch-memory = { path = "crates/finch-memory" }
finch-messages = { path = "crates/finch-messages" }
finch-node = { path = "crates/finch-node" }
finch-programs = { path = "crates/finch-programs" }
finch-providers = { path = "crates/finch-providers" }
finch-runtime = { path = "crates/finch-runtime" }
finch-theme = { path = "crates/finch-theme" }
finch-tui = { path = "crates/finch-tui" }
finch-ui-model = { path = "crates/finch-ui-model" }
finch-vm = { path = "crates/finch-vm" }

# CLI
clap = { version = "4.4", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3.4"
rustyline = "13.0"

# TUI (Phase 2: Terminal UI refactor)
ratatui = "0.29"
ansi-to-tui = "6.0"
tui-textarea = "0.7"  # Text area widget for ratatui (TUI mode)

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }  # compat needed for capnp-rpc TokioAsync{Read,Write}CompatExt
futures = "0.3"

# Global state for TUI output system (Phase 3.5)
once_cell = "1.19"
similar = "2.7"

# HTTP client for Claude API.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# HTTP server + WebSocket (session transport)
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tower-http = { version = "0.5", features = ["trace", "cors", "request-id"] }
tower = { version = "0.5", features = ["util"] }  # ServiceBuilder for the request-id/trace layer stack (#223)

# Service discovery (Phase 3: Daemon-Only Mode)
mdns-sd = "0.11"  # Cross-platform mDNS/DNS-SD for service advertisement
hostname = "0.4"  # System hostname detection

# Memory system (Phase 4: Hierarchical Memory)
rusqlite = { version = "0.32", features = ["bundled"] }  # SQLite with bundled library

# Session management
dashmap = "5.5"

# Metrics
prometheus = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Configuration
config = "0.14"
dirs = "5.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
cap-std = "4.0"
cap-fs-ext = "4.0"
thiserror = "1.0"

# Clipboard access (for image paste support)
arboard = { version = "3.6", features = ["image-data"] }

# Base64 encoding (for image data and license key encoding)
base64 = "0.22"

# Temporary files (for propose-before-execute editor flow)
tempfile = "3.8"

# Ed25519 signature verification for offline license key validation
ed25519-dalek = { version = "2", features = ["serde", "rand_core", "pkcs8"] }
rcgen = "0.13"

# secp256k1 — ECDSA signing/verification and raw EC point arithmetic
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }

# PNG encoding (for clipboard image data → PNG bytes)
png = "0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"  # Bridge log crate → tracing (Phase 3.5)

# Time and hashing
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ring = "0.17"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }

# Text processing for TF-IDF
rust-stemmers = "1.2"
pulldown-cmark = "0.13"
tree-sitter = "0.27"
tree-sitter-tags = "0.27"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

# Compressed-size ratio as a cheap redundancy signal for the memory-recall
# summarization gate (#8: raw vs. extractive-summary at injection time).
# Pure-Rust DEFLATE backend -- no C toolchain dependency for a signal this
# small.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Terminal display-cell widths for the component width vocabulary (#934);
# the same tables the test-only vt_oracle terminal model uses.
unicode-width = "0.2"

# Machine learning: llama.cpp backs daemon chat generation and, via its own
# embeddings mode, memory's frontend embedding engine (bge-small-en-v1.5
# GGUF). Keep the safe wrapper and vendored sys crate on the same release;
# chat uses Metal while the tiny embedding helper remains CPU-only until the
# upstream Metal residency-set teardown bug is resolved.
llama-cpp-2 = { version = "=0.1.157", default-features = false, features = ["common"] }
# Shared dependencies
sysinfo = "0.32"  # System RAM detection for model selection
tokenizers = "0.23"  # Retained training configuration (src/models/lora.rs)
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "ureq", "rustls-tls"] }  # Managed GGUF artifact resolution (src/models/gguf_download.rs)
indicatif = "0.17"  # Progress bars for download tracking
rand = { version = "0.8", features = ["small_rng"] }  # Random number generation for sampling

# Spreadsheet / tabular data
calamine = { version = "0.36.1", features = ["dates"] } # xlsx / xls / ods reading; `dates` turns Data::DateTime into a real date rather than an Excel serial (#281)
rust_xlsxwriter = "0.80"    # xlsx writing (pure Rust, no Excel needed)
csv = "1.3"                 # CSV and TSV parsing

# Cryptographic primitives used by Brain credentials and peer transport
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hex = "0.4"

# Tools
async-trait = "0.1"
regex = "1.10"
glob = "0.3"
walkdir = "2.4"
ignore = "0.4"
fs2 = "0.4"  # File locking for concurrent weight updates

# Unix signal handling (for daemon process checks)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["dir", "fs", "process", "signal", "user"] }

# Cap'n Proto IPC (CLI ↔ daemon over Unix socket)
capnp = "0.24"
capnp-rpc = "0.24"

# Windows exposes the file change timestamp only through handle metadata.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Root application tests construct a renderer without taking over a terminal.
finch-tui = { path = "crates/finch-tui", features = ["test-support"] }
semver = "1"
vte = "0.15"  # ANSI/VT byte parser for production console-writer regressions
h2 = "0.4.16"  # Raw HTTP/2 protocol fixtures for transport-boundary regressions
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }  # Raw WSS protocol fixtures for TLS transport-boundary regressions
mockito = "1.2"
tempfile = "3.8"
# Enables finch-runtime's cross-crate test seams only for finch's own test
# builds; resolver = "2" keeps this feature out of production artifacts.
finch-runtime = { path = "crates/finch-runtime", features = ["test-support"] }
# Enables the certificate-validity constructor only in Finch's dependent test
# build; production artifacts keep finch-node's test seam disabled.
finch-node = { path = "crates/finch-node", features = ["test-support"] }
# Enables finch-brain's cross-crate application-test seams only for Finch's
# own test build; resolver = "2" keeps this out of production artifacts.
finch-brain = { path = "crates/finch-brain", features = ["test-support"] }
# tower moved to [dependencies] (#223): ServiceBuilder is now used in production
# for the request-id/trace layer stack, and ServiceExt::oneshot() for tests
# comes along with it as a regular dependency.
http-body-util = "0.1"  # axum::body::to_bytes helper
tokio = { version = "1.35", features = ["test-util"] }  # start_paused for time-controlled tests

# A real PTY for the interactive-startup regression (#364). `nix` is already a
# unix dependency; `term` is what gates `nix::pty::openpty`, so this adds a
# module rather than a crate. Test-only: nothing in the binary opens a PTY.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["term", "process", "signal"] }

[features]
default = ["llama-cpp"]  # llama.cpp GGUF is the sole daemon local-chat engine
llama-cpp = []  # Compatibility feature name; GGUF support is always built

[[bin]]
name = "finch"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
